<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Luckiest"; src: url("luckiest-guy-latin-400-normal.woff2"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 512px; height: 512px; overflow: hidden; }
body { position: relative; background: radial-gradient(circle at 50% 38%, #8a5cff 0%, #4b2aa8 45%, #1e1240 100%); }
.stars { position: absolute; inset: 0; background-image:
  radial-gradient(2px 2px at 40px 60px, #fff, transparent), radial-gradient(2px 2px at 120px 30px, #ffe9a8, transparent),
  radial-gradient(2px 2px at 300px 50px, #fff, transparent), radial-gradient(3px 3px at 430px 90px, #bff7ff, transparent),
  radial-gradient(2px 2px at 470px 30px, #fff, transparent), radial-gradient(2px 2px at 220px 20px, #fff, transparent); }
.mountain { position: absolute; left: -40px; bottom: -120px; width: 600px; height: 420px;
  background: linear-gradient(#e9f3ff 0 18%, #6f7fb3 18% 100%); clip-path: polygon(0 100%, 30% 32%, 42% 46%, 55% 12%, 72% 40%, 82% 28%, 100% 100%); opacity: .9; }
.glow { position: absolute; left: 116px; top: 120px; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(#ffd75e 0%, rgba(255,170,40,.55) 40%, transparent 70%); }
.hero { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); width: 470px; height: 470px; object-fit: contain; filter: drop-shadow(0 10px 0 rgba(20,10,40,.55)); }
.egg { position: absolute; width: 170px; height: 170px; object-fit: contain; filter: drop-shadow(0 6px 0 rgba(20,10,40,.5)); }
.egg.l { left: -6px; bottom: 6px; transform: rotate(-14deg); }
.egg.r { right: -10px; bottom: 0px; transform: rotate(12deg); }
.title { position: absolute; left: 0; right: 0; top: 14px; text-align: center; font-family: "Luckiest"; font-size: 62px; line-height: .95; color: #ffe04d;
  -webkit-text-stroke: 9px #1d1630; paint-order: stroke fill; text-shadow: 0 7px 0 #1d1630; transform: rotate(-3deg); }
.title span { color: #ff5a6e; }
</style></head>
<body>
  <div class="stars"></div>
  <div class="mountain"></div>
  <div class="glow"></div>
  <img class="hero" src="HERO">
  <img class="egg l" src="EGG_LEFT">
  <img class="egg r" src="EGG_RIGHT">
  <div class="title">STEAL<br><span>EGGS!</span></div>
</body></html>
